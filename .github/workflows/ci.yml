name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel superseded PR runs, but let every commit on main finish its checks
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: CI / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: ruff check --output-format=github .
      - name: Runner images are pinned, never *-latest
        run: |
          if grep -rnE '^[[:space:]]*(runs-on|os):[^#]*-latest' .github/workflows; then
            echo "::error::pin runner images to a version (ubuntu-24.04, macos-26), not *-latest"
            exit 1
          fi

  test:
    name: CI / test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements/dev.txt
      - name: Tests (sockets are blocked, see tests/conftest.py)
        run: coverage run -m pytest
      - run: coverage report

  build:
    name: CI / build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements/dev.txt -r requirements/release.txt
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - name: The wheel installs and runs in a clean venv
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install --no-deps dist/*.whl
          /tmp/wheel/bin/gridhour-au --version
      - name: The test suite runs from the sdist, as packagers run it
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && python -m pytest -q
